services:
  - type: web
    name: nexora-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars: &nexora_env
      - key: APP_NAME
        value: NEXORA
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: 0.1.0
      - key: LOG_LEVEL
        value: INFO
      - key: FRONTEND_URL
        value: https://nexora-web-g9td.onrender.com
      - key: CORS_ORIGINS
        value: https://nexora-web-g9td.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: nexora-documents
      - key: STORAGE_BACKEND
        value: supabase
      - key: LOCAL_UPLOAD_DIR
        value: ./uploads
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: JWT_EXPIRES_MINUTES
        value: 10080
      - key: COOKIE_NAME
        value: nexora_token
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://nexora-web-g9td.onrender.com/api/auth/google/callback
      - key: SUPER_ADMIN_EMAILS
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-20250514
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: LLM_MAX_PAGES
        value: "8"
      - key: LLM_MAX_INPUT_CHARS
        value: "60000"
      - key: LLM_TIMEOUT_SECONDS
        value: "120"
      - key: DEFAULT_PRICE_SPIKE_THRESHOLD_PCT
        value: "10"
      - key: MIN_EXTRACTION_CONFIDENCE
        value: "0.75"
      - key: DEFAULT_CURRENCY
        value: CLP
      - key: PRICE_LOOKBACK_DAYS
        value: "365"
      - key: MIN_HISTORY_SAMPLES
        value: "2"
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: PROCESS_IN_BACKGROUND
        value: "true"
      - key: WORKER_POLL_SECONDS
        value: "10"

  - type: worker
    name: nexora-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m src.worker
    autoDeploy: true
    envVars: *nexora_env
